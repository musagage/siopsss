<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery Index</title>
    <style>
        body {
            font-family: Tahoma, Geneva, sans-serif;
            background: #c0c0c0;
            margin: 0;
            padding: 20px;
            color: #000;
        }

        .window {
            background: #c0c0c0;
            border: 2px solid #000;
            border-radius: 0;
            width: 600px;
            margin: 0 auto;
            box-shadow: 
                inset -1px -1px #000,
                inset 1px 1px #dfdfdf,
                inset -2px -2px #808080,
                inset 2px 2px #fff;
        }

        .title-bar {
            background: #c0c0c0;
            padding: 2px 4px;
            color: #000;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-bar-text {
            padding-left: 4px;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .title-bar-button {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px solid #000;
            box-shadow: 
                inset -1px -1px #000,
                inset 1px 1px #fff;
            font-size: 10px;
            line-height: 12px;
            text-align: center;
            cursor: pointer;
        }

        .content {
            padding: 16px;
            background: #c0c0c0;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #000;
            font-weight: normal;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 24px;
            font-size: 12px;
            color: #000;
        }

        .gallery-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .gallery-item {
            margin-bottom: 8px;
        }

        .gallery-link {
            display: block;
            padding: 8px 16px;
            background: #c0c0c0;
            border: 2px solid #000;
            text-decoration: none;
            color: #000;
            font-size: 14px;
            box-shadow: 
                inset -1px -1px #000,
                inset 1px 1px #fff;
            transition: all 0.1s;
        }

        .gallery-link:active {
            box-shadow: 
                inset 1px 1px #000,
                inset -1px -1px #fff;
            background: #808080;
        }

        .gallery-link.empty {
            color: #808080;
        }

        .count {
            float: right;
            font-size: 12px;
            background: #000;
            color: #fff;
            padding: 2px 6px;
            margin-left: 10px;
        }

        .divider {
            height: 2px;
            background: #808080;
            border-bottom: 2px solid #fff;
            margin: 16px 0;
        }

        .status-bar {
            background: #c0c0c0;
            border-top: 2px solid #000;
            padding: 4px 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            box-shadow: 
                inset -1px -1px #000,
                inset 1px 1px #fff;
        }

        .status-section {
            border: 1px solid #808080;
            padding: 2px 4px;
            background: #fff;
            box-shadow: 
                inset -1px -1px #808080,
                inset 1px 1px #fff;
        }

        /* Blinking cursor effect */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .cursor {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">Photo Gallery</div>
            <div class="title-bar-controls">
                <div class="title-bar-button">_</div>
                <div class="title-bar-button">[]</div>
                <div class="title-bar-button">X</div>
            </div>
        </div>
        
        <div class="content">
            <h1>Photo Gallery</h1>
            <div class="divider"></div>
            
            <p class="subtitle">Select a gallery to view photos<span class="cursor">_</span></p>
            
            <ul class="gallery-links">
                <li class="gallery-item">
                    <a href="result-day.html" class="gallery-link">
                        Result Day
                        <span class="count">40</span>
                    </a>
                </li>
                <li class="gallery-item">
                    <a href="activity-day.html" class="gallery-link">
                        Activity Day
                        <span class="count">47</span>
                    </a>
                </li>
                <li class="gallery-item">
                    <a href="examination.html" class="gallery-link">
                        Examination
                        <span class="count">37</span>
                    </a>
                </li>
                <li class="gallery-item">
                    <a href="red-day.html" class="gallery-link">
                        Red Day
                        <span class="count">21</span>
                    </a>
                </li>
                <li class="gallery-item">
                    <a href="health-day.html" class="gallery-link">
                        Health Day
                        <span class="count">11</span>
                    </a>
                </li>
                <li class="gallery-item">
                    <a href="school-trip.html" class="gallery-link">
                        School Trip
                        <span class="count">57</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <div class="status-bar">
            <div class="status-section">Ready</div>
            <div class="status-section">6 items</div>
            <div class="status-section">Sys 8.0</div>
        </div>
    </div>
</body>
</html>
